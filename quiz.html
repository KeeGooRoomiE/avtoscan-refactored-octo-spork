// ---------- base64url для самодостаточной ссылки ----------

// gzip через нативный CompressionStream — без внешних библиотек. Старые ссылки (без сжатия)
// и браузеры без поддержки декодируются тем же путём: DecompressionStream бросает на не-gzip
// данных, тогда просто берём байты как есть.
async function gzipCompress(bytes) {
  if (!window.CompressionStream) return bytes;
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(bytes);
  writer.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function gzipDecompress(bytes) {
  if (!window.DecompressionStream) return bytes;
  try {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  } catch (e) {
    return bytes;
  }
}

async function toBase64Url(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const compressed = await gzipCompress(bytes);
  let binary = '';
  compressed.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function fromBase64Url(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const decompressed = await gzipDecompress(bytes);
  return JSON.parse(new TextDecoder().decode(decompressed));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;

// Если у вопросов расставлены категории — берём примерно поровну из каждой (round-robin
// по перемешанным группам), чтобы тест не мог случайно состоять почти целиком из одной темы.
// Без категорий (или если все вопросы без category) — обычный плоский рандом, как раньше.
function pickBalancedByCategory(pool, count) {
  const groups = new Map();
  pool.forEach(q => {
    const key = q.category || '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  });
  groups.forEach(arr => shuffle(arr));

  const keys = shuffle(Array.from(groups.keys()));
  const picked = [];
  let anyLeft = true;
  while (picked.length < count && anyLeft) {
    anyLeft = false;
    for (const key of keys) {
      if (picked.length >= count) break;
      const arr = groups.get(key);
      if (arr.length) {
        picked.push(arr.shift());
        anyLeft = true;
      }
    }
  }
  return shuffle(picked);
}

// Точные количества по категориям, заданные в редакторе (test.category_counts = {категория: N}).
// Категории, не перечисленные в category_counts, в выборку не попадают вообще — это осознанный
// куррированный набор, а не «плюс сколько-то случайных сверху». Если в категории вопросов меньше,
// чем запрошено — берём сколько есть, без ошибки.
function pickByExactCategoryCounts(pool, categoryCounts) {
  const groups = new Map();
  pool.forEach(q => {
    const key = q.category || '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  });
  groups.forEach(arr => shuffle(arr));

  const picked = [];
  Object.entries(categoryCounts).forEach(([cat, n]) => {
    const arr = groups.get(cat) || [];
    picked.push(...arr.slice(0, n));
  });
  return shuffle(picked);
}

// ---------- экран теста ----------

function startTimer() {
  updateTimerDisplay();
  timerHandle = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerHandle);
      finishQuiz();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.max(0, Math.floor(timerRemaining / 60));
  const s = Math.max(0, timerRemaining % 60);
  const el = document.getElementById('quizTimer');
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  el.classList.toggle('warn', timerRemaining <= 60);
}

function renderQuestion() {
  const q = selectedQuestions[currentIndex];
  document.getElementById('quizProgress').textContent = `Вопрос ${currentIndex + 1} из ${selectedQuestions.length}`;
  document.getElementById('progressFill').style.width = ((currentIndex) / selectedQuestions.length * 100) + '%';
  document.getElementById('qText').textContent = q.text;

  const area = document.getElementById('qAnswerArea');
  area.innerHTML = '';
  const given = answers[currentIndex].given;

  if (q.type === 'free') {
    const ta = document.createElement('textarea');
    ta.className = 'free-answer';
    ta.placeholder = 'Введите ответ…';
    ta.value = given[0] || '';
    ta.oninput = () => { answers[currentIndex].given = [ta.value]; };
    area.appendChild(ta);
  } else {
    (q.options || []).forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ans-btn' + (given.includes(oi) ? ' checked' : '');
      btn.innerHTML = `<span class="ans-circle${q.type === 'multiple' ? ' square' : ''}"></span><span class="ans-label"></span>`;
      btn.querySelector('.ans-label').textContent = opt;
      btn.onclick = () => {
        if (q.type === 'single') {
          answers[currentIndex].given = [oi];
        } else {
          const g = answers[currentIndex].given;
          const pos = g.indexOf(oi);
          if (pos === -1) g.push(oi); else g.splice(pos, 1);
        }
        renderQuestion();
      };
      area.appendChild(btn);
    });
  }

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === selectedQuestions.length - 1 ? 'Завершить тест' : 'Далее';
}

function goPrev() {
  if (currentIndex === 0) return;
  currentIndex--;
  renderQuestion();
}

function goNext() {
  if (currentIndex === selectedQuestions.length - 1) {
    finishQuiz();
    return;
  }
  currentIndex++;
  renderQuestion();
}

async function finishQuiz() {
  if (timerHandle) clearInterval(timerHandle);

  const durationSeconds = Math.round((Date.now() - quizStartedAt) / 1000);
  const detailedAnswers = selectedQuestions.map((q, i) => {
    const given = answers[i].given;
    if (q.type === 'free') {
      return { question_id: q.id, text: q.text, type: q.type, given, correct: null, is_correct: null, manager_verdict: null };
    }
    const correct = q.correct || [];
    const isCorrect = given.length === correct.length && given.slice().sort().every((v, idx) => v === correct.slice().sort()[idx]);
    return { question_id: q.id, text: q.text, options: q.options, type: q.type, given, correct, is_correct: isCorrect };
  });

  //TODO: разделить на экран ответа и экран с ссылкой

  const scorable = detailedAnswers.filter(a => a.type !== 'free');
  const correctCount = scorable.filter(a => a.is_correct).length;
  const totalCount = scorable.length;
  const scorePercent = totalCount ? Math.round((correctCount / totalCount) * 1000) / 10 : 0;

  const testId = document.getElementById('sectionSelect').value;
  const test = TESTS.find(t => t.id === testId);

  const token = {
    v: 1,
    result_hash: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    timestamp: new Date().toISOString(),
    full_name: document.getElementById('fullNameInput').value.trim(),
    position: document.getElementById('positionSelect').value,
    test_id: testId,
    section: test ? test.name : testId,
    duration_seconds: durationSeconds,
    answers: detailedAnswers,
    score_percent: scorePercent,
    correct_count: correctCount,
    total_count: totalCount,
  };

  location.hash = 'd=' + await toBase64Url(token);
  document.getElementById('quizScreen').style.display = 'none';
  showResult(token, true);

  sendResultEmail(token); // - tut 
}

function sendResultEmail(token) {
  if (!selectedManager) return;

  const answersForEmail = token.answers.slice(0, 200).map(a => {
    let givenText;
    if (a.type === 'free') {
      givenText = a.given[0] || '';
    } else {
      givenText = a.given.length ? a.given.map(gi => a.options[gi]).join(', ') : '—';
    }
    return { text: a.text, type: a.type, given_text: givenText, is_correct: a.is_correct };
  });

  fetch(QUIZ_RESULT_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Quiz-Token': QUIZ_TOKEN,
    },
    body: JSON.stringify({
      recipient_email: selectedManager.email,
      recipient_name: selectedManager.name,
      full_name: token.full_name,
      position: POSITION_LABELS[token.position] || token.position,
      test_name: token.section,
      score_percent: token.score_percent,
      correct_count: token.correct_count,
      total_count: token.total_count,
      duration_seconds: token.duration_seconds,
      timestamp: token.timestamp,
      result_link: location.href,
      answers: answersForEmail,
    }),
  }).catch(() => {}); // сетевая ошибка не должна ломать показ результата сотруднику
}

// ---------- экран результата ----------

function showResult(token, alreadyOnPage) {
  currentToken = token;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'flex';

  document.getElementById('scoreNum').textContent = token.score_percent + '%';
  document.getElementById('scoreSub').textContent = `${token.correct_count} из ${token.total_count} верно`;

  const date = new Date(token.timestamp);
  const dateStr = isNaN(date) ? token.timestamp : date.toLocaleString('ru-RU');
  const minutes = Math.floor(token.duration_seconds / 60);
  const seconds = token.duration_seconds % 60;

  document.getElementById('resultMeta').innerHTML = `
    <div class="row"><span class="k">ФИО</span><b>${escapeHtml(token.full_name)}</b></div>
    <div class="row"><span class="k">Должность</span><b>${escapeHtml(POSITION_LABELS[token.position] || token.position)}</b></div>
    <div class="row"><span class="k">Раздел</span><b>${escapeHtml(token.section)}</b></div>
    <div class="row"><span class="k">Дата</span><b>${dateStr}</b></div>
    <div class="row"><span class="k">Длительность</span><b>${minutes} мин ${seconds} сек</b></div>
  `;

  document.getElementById('resultLink').value = location.href;

  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';
  token.answers.forEach((a, i) => {
    const div = document.createElement('div');
    let cls, tag;
    if (a.type === 'free') {
      if (a.manager_verdict === true) { cls = 'correct'; tag = '<span class="bd-tag ok">Верно (оценено)</span>'; }
      else if (a.manager_verdict === false) { cls = 'incorrect'; tag = '<span class="bd-tag no">Неверно (оценено)</span>'; }
      else { cls = 'manual'; tag = '<span class="bd-tag manual-tag">На ручную проверку</span>'; }
    } else {
      cls = a.is_correct ? 'correct' : 'incorrect';
      tag = a.is_correct ? '<span class="bd-tag ok">Верно</span>' : '<span class="bd-tag no">Неверно</span>';
    }
    div.className = 'bd-item ' + cls;
    let answerHtml;
    if (a.type === 'free') {
      answerHtml = `<div class="bd-a">Ответ: <b>${escapeHtml(a.given[0] || '—')}</b></div>
        <div class="verdict-row">
          <button class="verdict-btn ok${a.manager_verdict === true ? ' active' : ''}" onclick="setVerdict(${i}, true)">Верно</button>
          <button class="verdict-btn no${a.manager_verdict === false ? ' active' : ''}" onclick="setVerdict(${i}, false)">Неверно</button>
        </div>`;
    } else {
      const givenText = a.given.length ? a.given.map(gi => a.options[gi]).join(', ') : '—';
      answerHtml = `<div class="bd-a">Ответ сотрудника: <b>${escapeHtml(givenText)}</b></div>`;
    }
    div.innerHTML = `${tag}<div class="bd-q">${i + 1}. ${escapeHtml(a.text)}</div>${answerHtml}`;
    bd.appendChild(div);
  });

  const hasFree = token.answers.some(a => a.type === 'free');
  const recalcBtn = document.getElementById('recalcBtn');
  recalcBtn.style.display = hasFree ? 'block' : 'none';
}

function setVerdict(i, val) {
  currentToken.answers[i].manager_verdict = currentToken.answers[i].manager_verdict === val ? null : val;
  showResult(currentToken, true);
}

function recomputeScore(token) {
  let correct = 0, total = 0;
  token.answers.forEach(a => {
    if (a.type === 'free') {
      if (a.manager_verdict === true) { correct++; total++; }
      else if (a.manager_verdict === false) { total++; }
    } else {
      total++;
      if (a.is_correct) correct++;
    }
  });
  token.correct_count = correct;
  token.total_count = total;
  token.score_percent = total ? Math.round((correct / total) * 1000) / 10 : 0;
}

async function recalcAndRelink() {
  recomputeScore(currentToken);
  location.hash = 'd=' + await toBase64Url(currentToken);
  showResult(currentToken, true);
  setStatus('recalcStatus', 'Ссылка обновлена — скопируйте новую и отправьте сотруднику/сохраните.', 'ok');
}

function setStatus(elId, text, cls) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = text;
  el.className = 'status-msg' + (cls ? ' ' + cls : '');
}

function copyResultLink() {
  const input = document.getElementById('resultLink');
  const btn = document.getElementById('copyBtn');
  input.select();
  navigator.clipboard?.writeText(input.value).catch(() => {});

  const original = btn.innerHTML;
  btn.innerHTML = '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.innerHTML = original;
    btn.classList.remove('copied');
  }, 1200);
}

function restart() {
  location.hash = '';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('fullNameInput').value = '';
  document.getElementById('positionSelect').value = '';
  onPositionChange();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
