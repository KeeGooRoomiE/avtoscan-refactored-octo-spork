<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор вопросов — Автоскан.Тестирование</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap');
:root { --blue: #1a56a0; --border: #d0dcea; --muted: #6b7f9a; --text: #1a2a4a; --green: #1e9e52; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Golos Text', sans-serif; background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: stretch; color: var(--text); }
.site-header { display: flex; justify-content: flex-start; }
.site-header img { width: 1024px; max-width: 100%; display: block; }
.site-footer { display: flex; justify-content: flex-end; }
.site-footer img { width: 1024px; max-width: 100%; display: block; }
.main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 24px 48px; gap: 20px; }

.panel-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 16px; }
.field-label { font-size: 11px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
.field-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 15px; color: var(--text); outline: none; transition: border-color .18s, box-shadow .18s; background: #fafcff; margin-bottom: 16px; }
.field-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,160,.10); background: #fff; }
.field-input::placeholder { color: #b0bfcc; }

.btn { padding: 11px 20px; border: none; border-radius: 9px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: .4px; transition: background .18s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-blue { background: var(--blue); color: #fff; box-shadow: 0 4px 16px rgba(26,86,160,.20); }
.btn-blue:hover:not(:disabled) { background: #154988; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover:not(:disabled) { background: #187e42; }
.btn-ghost { background: #f4f7fb; color: var(--text); border: 1.5px solid var(--border); }
.btn-ghost:hover:not(:disabled) { background: #eef3fa; }

.card { width: 100%; max-width: 420px; background: #f4f7fb; border: 1.5px solid var(--border); border-radius: 10px; padding: 24px; }
.status-msg { font-size: 12px; min-height: 16px; text-align: center; margin-top: 10px; }
.status-msg.error { color: #e74c3c; }
.status-msg.ok { color: var(--green); }

.toolbar { width: 100%; max-width: 640px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.toolbar .status-msg { margin: 0; text-align: left; }

.hint { font-size: 12px; color: var(--muted); max-width: 640px; }

/* --- список карточек (тестов или вопросов) --- */
.qlist { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 640px; }

.add-card-btn {
  width: 100%; border: none; border-radius: 12px; background: var(--blue); color: #fff;
  font-size: 30px; font-weight: 700; line-height: 1; cursor: pointer; padding: 22px;
  box-shadow: 0 4px 16px rgba(26,86,160,.20); transition: background .18s, transform .1s;
}
.add-card-btn.labeled { font-size: 16px; padding: 16px 22px; }
.add-card-btn:hover { background: #154988; }
.add-card-btn:active { transform: scale(.99); }

.icon-btn { border: none; background: none; cursor: pointer; padding: 3px; color: var(--muted); flex-shrink: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; transition: color .15s, background .15s; }
.icon-btn svg { display: block; }
.icon-btn:hover { color: var(--text); background: #f4f7fb; }
.icon-btn.delete:hover { color: #e74c3c; background: #fdf2f2; }
.icon-btn.done { color: var(--green); }

.q-id { font-size: 10px; color: var(--muted); word-break: break-all; }
.q-err { font-size: 11px; color: #e74c3c; min-height: 14px; }

/* --- список тестов --- */
.test-card { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.test-card.deleted { opacity: .5; }
.test-title-row { display: flex; align-items: flex-start; gap: 6px; }
.test-name-input { flex: 1; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text); border: none; background: transparent; outline: none; padding: 2px 0; }
.test-name-input::placeholder { color: #b0bfcc; font-weight: 400; }
.test-meta-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.test-position-select { border: 1.5px solid var(--border); background: #fafcff; color: var(--text); font-family: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px; }
.test-count { flex: 1; }
.test-qcount-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.test-qcount-label { white-space: nowrap; }
.test-qcount-input { width: 56px; border: 1.5px solid var(--border); background: #fafcff; color: var(--text); font-family: inherit; font-size: 12px; padding: 5px 6px; border-radius: 6px; }
.test-catcounts { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #fafcff; border: 1px dashed var(--border); border-radius: 8px; }
.test-catcounts-label { font-size: 11px; color: var(--muted); }
.test-catcount-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
.test-catcount-name { color: var(--text); }
.test-catcount-input { width: 56px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font-family: inherit; font-size: 12px; padding: 5px 6px; border-radius: 6px; flex-shrink: 0; }
.test-catcounts-total { font-size: 11px; color: var(--blue); font-weight: 700; }
.q-category-input { border: 1.5px solid var(--border); background: #fafcff; color: var(--text); font-family: inherit; font-size: 12.5px; padding: 6px 9px; border-radius: 6px; align-self: flex-start; }
.test-open-btn { align-self: stretch; text-align: center; padding: 9px; border-radius: 8px; border: 1.5px solid var(--border); background: #f4f7fb; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; }
.test-open-btn:hover { background: #eef3fa; }

.back-link { align-self: flex-start; border: none; background: none; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px 0; }
.back-link:hover { text-decoration: underline; }
.active-test-heading { font-size: 17px; font-weight: 700; color: var(--text); }
.active-test-sub { font-size: 12px; color: var(--muted); margin-top: -14px; }

/* --- карточки вопросов --- */
.q-card { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.q-card.deleted { opacity: .5; }

.q-title-row { display: flex; align-items: flex-start; gap: 4px; }
.q-title-input {
  flex: 1; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text);
  border: none; background: transparent; outline: none; resize: none; overflow: hidden; padding: 2px 0;
}
.q-title-input::placeholder { color: #b0bfcc; font-weight: 400; }

.q-edit { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; margin-top: 4px; border-top: 1px dashed var(--border); }

.q-type-select { padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 13px; background: #fafcff; color: var(--text); align-self: flex-start; }

.q-options { display: flex; flex-direction: column; gap: 6px; }
.q-option-row { display: flex; align-items: center; gap: 8px; }
.q-option-check { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--green); cursor: pointer; }
.q-option-row input[type=text] { flex: 1; padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 13px; background: #fafcff; color: var(--text); }
.q-option-remove { border: none; background: none; color: var(--muted); cursor: pointer; padding: 3px; display: inline-flex; border-radius: 5px; }
.q-option-remove:hover { color: #e74c3c; background: #fdf2f2; }
.q-option-remove svg { display: block; }

.q-add-option { align-self: flex-start; margin-top: 4px; font-size: 12.5px; padding: 4px 2px; border: none; background: none; color: var(--blue); cursor: pointer; }
.q-add-option:hover { text-decoration: underline; }

.q-free-input { width: 100%; padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 13px; background: #fafcff; color: var(--text); }
</style>
</head>

<div class="main">

  <div id="lockScreen" class="card">

<script>

  //глобальные настройки под последующий шаблон
const PASSWORD_HASH_HEX = 'f956298be4244f631c2b9e4125a6c0447b85898319626d6d2000c900fabab27e';

// Порт 26502: 443 у base.avtoscan42.ru снаружи не открывается (см. wikinest_avtoscan/Caddyfile).
const QUIZ_BASE = 'https://base.avtoscan42.ru:26502';
const QUIZ_DATA_TESTS_URL = `${QUIZ_BASE}/api/quiz-data/tests`;
const QUIZ_DATA_QUESTIONS_URL = `${QUIZ_BASE}/api/quiz-data/questions`;
const QUIZ_DATA_PUBLISH_URL = `${QUIZ_BASE}/api/quiz-data/publish`;
// Оба — не настоящие секреты, урезаны до своей ручки, см. wikinest_avtoscan/.claude/brief-quiz-backend-migration.md
const QUIZ_TOKEN = 'R8E8E3nXZOSPxBg9FfYn0L5HCbbOod0gzmXuixbogpE';       // чтение банка (X-Quiz-Token)
const EDITOR_API_TOKEN = 'PQBo1MA8lwoCfQV7Et7_dHk4wYAh6P-d1NHaVwOCfYQ'; // публикация (X-Editor-Token)

const POSITIONS = [
  { value: 'mop', label: 'Отдел продаж' },
  { value: 'tp', label: 'Техническая поддержка' },
  { value: 'service', label: 'Отдел сервиса' },
];
const TYPES = [
  { value: 'single', label: 'Один ответ' },
  { value: 'multiple', label: 'Несколько ответов' },
  { value: 'free', label: 'Свободный текст' },
];
const DEFAULT_QUESTION_COUNT = 20; // если у теста не задано своё question_count — quiz.html берёт столько же значение по умолчанию

// фиксированный список категорий вопросов — не свободный ввод
const CATEGORIES = ['Регламенты', 'Оборудование', 'CRM Bitrix24', '1С', 'Законодательство'];

//иконки одной кучей, потому что тут их легче редачить
const ICON_TRASH = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M6 6l.6 9.4A1.5 1.5 0 0 0 8.1 17h3.8a1.5 1.5 0 0 0 1.5-1.6L14 6"/></svg>';
const ICON_PENCIL = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 3.4a1.6 1.6 0 0 1 2.3 2.3L6.8 14.6l-3.4.7.7-3.4 9.3-9.5z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
const ICON_X = '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l10 10M15 5L5 15"/></svg>';

let originalById = new Map();       // id -> plain question snapshot (как загружено из репозитория)
let working = [];                   // рабочие вопросы: канонические поля + _isNew / _deleted / _expanded
let originalTestsById = new Map();  // id -> plain test snapshot
let workingTests = [];              // рабочие тесты: {id, position, name} + _isNew / _deleted
let activeTestId = null;            // null = список тестов, иначе — редактируем вопросы этого теста

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryUnlock() {
  const statusEl = document.getElementById('lockStatus');
  statusEl.textContent = '';
  const pass = document.getElementById('passInput').value;
  if (!pass) return;
  if (!window.crypto || !window.crypto.subtle) {
    statusEl.textContent = 'crypto.subtle недоступен (нужен https или localhost)';
    return;
  }
  const hex = await sha256Hex(pass);
  if (hex !== PASSWORD_HASH_HEX) {
    statusEl.textContent = 'Неверный пароль';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  afterUnlock();
}

function afterUnlock() {
  showEditor();
}

function showEditor() {
  document.getElementById('editorScreen').style.display = 'flex';
  loadBank();
}

function setStatus(elId, text, cls) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = 'status-msg' + (cls ? ' ' + cls : '');
}

async function loadBank() {
  setStatus('mainStatus', 'Загружаю банк…');
  try {
    const [testsRes, qRes] = await Promise.all([
      fetch(QUIZ_DATA_TESTS_URL, { headers: { 'X-Quiz-Token': QUIZ_TOKEN } }),
      fetch(QUIZ_DATA_QUESTIONS_URL, { headers: { 'X-Quiz-Token': QUIZ_TOKEN } }),
    ]);
    if (!testsRes.ok || !qRes.ok) throw new Error(`бэкенд вернул ${testsRes.status}/${qRes.status}`);
    const tests = await testsRes.json();
    const questions = await qRes.json();

    originalTestsById = new Map(tests.map(t => [t.id, JSON.parse(JSON.stringify(t))]));
    workingTests = tests.map(t => Object.assign(JSON.parse(JSON.stringify(t)), { _isNew: false, _deleted: false }));

    originalById = new Map(questions.map(q => [q.id, JSON.parse(JSON.stringify(q))]));
    working = questions.map(q => Object.assign(JSON.parse(JSON.stringify(q)), { _isNew: false, _deleted: false, _expanded: false }));

    activeTestId = null;
    render();
    setStatus('mainStatus', `Загружено тестов: ${tests.length}, вопросов: ${questions.length}`, 'ok');
  } catch (e) {
    setStatus('mainStatus', 'Не удалось загрузить банк: ' + e.message, 'error');
  }
}

function slugify(s) {
  return (s || 'test').toLowerCase()
    .replace(/[^a-z0-9а-яё]+/gi, '-')
    .replace(/^-+|-+$/g, '') || 'test';
}
function randHex() {
  return Array.from(crypto.getRandomValues(new Uint8Array(3))).map(b => b.toString(16).padStart(2, '0')).join('');
}
function genId(name) {
  return `${slugify(name)}-${randHex()}`;
}
function genTestId() {
  return `test-${randHex()}`;
}

function mkEl(tag, attrs) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
  return e;
}

// ---------- маршрутизация: список тестов <-> вопросы конкретного теста ----------

function render() {
  if (activeTestId === null) renderTestList();
  else renderQuestionsForActiveTest();
}

// ---------- список тестов ----------

function addTest() {
  workingTests.unshift({ id: genTestId(), position: '', name: '', _isNew: true, _deleted: false });
  render();
}

function toggleTestDeleted(idx) {
  const t = workingTests[idx];
  if (t._isNew) {
    const tid = t.id;
    workingTests.splice(idx, 1);
    working = working.filter(q => q.test_id !== tid);
    if (activeTestId === tid) activeTestId = null;
    render();
    return;
  }
  const newDeleted = !t._deleted;
  if (newDeleted) {
    const count = working.filter(q => q.test_id === t.id && !q._deleted).length;
    if (!confirm(`Удалить тест «${t.name || t.id}»${count ? ' и все вопросы в нём (' + count + ')' : ''}? Правки применятся после публикации.`)) return;
  }
  t._deleted = newDeleted;
  working.forEach(q => { if (q.test_id === t.id && !q._isNew) q._deleted = newDeleted; });
  if (newDeleted) working = working.filter(q => !(q.test_id === t.id && q._isNew));
  render();
}

function validateTest(t) {
  const errors = [];
  if (!t.name || !t.name.trim()) errors.push('нет названия');
  if (!t.position) errors.push('не выбрана должность');
  return errors;
}

function findDuplicateTestIds() {
  const seen = new Map();
  const dupIds = new Set();
  workingTests.filter(t => !t._deleted && t.position && t.name && t.name.trim()).forEach(t => {
    const key = t.position + '::' + t.name.trim().toLowerCase();
    if (seen.has(key)) { dupIds.add(t.id); dupIds.add(seen.get(key)); }
    else seen.set(key, t.id);
  });
  return dupIds;
}

function revalidateTest(idx) {
  const t = workingTests[idx];
  let errs = t._deleted ? [] : validateTest(t);
  if (!t._deleted && findDuplicateTestIds().has(t.id)) errs = errs.concat('такой тест для этой должности уже есть');
  const errEl = document.querySelector(`[data-test-err-for="${idx}"]`);
  if (errEl) errEl.textContent = errs.length ? '⚠ ' + errs.join(', ') : '';
  updatePublishState();
}

function renderTestList() {
  const el = document.getElementById('qlist');
  el.innerHTML = '';

  const addBtn = mkEl('button', { class: 'add-card-btn labeled' });
  addBtn.textContent = '+ Создать тест';
  addBtn.onclick = addTest;
  el.appendChild(addBtn);

  workingTests.forEach((t, idx) => el.appendChild(buildTestCard(t, idx)));

  workingTests.forEach((t, idx) => revalidateTest(idx));
  updatePublishState();
}

function buildTestCard(t, idx) {
  const card = mkEl('div', { class: 'test-card' + (t._deleted ? ' deleted' : '') });

  const idRow = mkEl('div', { class: 'q-id' });
  idRow.textContent = t.id;
  card.appendChild(idRow);

  const titleRow = mkEl('div', { class: 'test-title-row' });
  const nameInput = mkEl('input', { type: 'text', class: 'test-name-input', placeholder: 'Название теста…' });
  nameInput.value = t.name || '';
  nameInput.oninput = () => { t.name = nameInput.value; revalidateTest(idx); };
  titleRow.appendChild(nameInput);

  const delBtn = mkEl('button', { class: 'icon-btn delete', title: t._deleted ? 'Восстановить тест' : 'Удалить тест' });
  delBtn.innerHTML = ICON_TRASH;
  delBtn.onclick = () => toggleTestDeleted(idx);
  titleRow.appendChild(delBtn);
  card.appendChild(titleRow);

  const metaRow = mkEl('div', { class: 'test-meta-row' });
  const posSelect = mkEl('select', { class: 'test-position-select' });
  const emptyOpt = mkEl('option', { value: '' });
  emptyOpt.textContent = 'Должность…';
  posSelect.appendChild(emptyOpt);
  POSITIONS.forEach(p => {
    const opt = mkEl('option', { value: p.value });
    opt.textContent = p.label;
    if (p.value === t.position) opt.selected = true;
    posSelect.appendChild(opt);
  });
  posSelect.onchange = () => { t.position = posSelect.value; revalidateTest(idx); };
  metaRow.appendChild(posSelect);

  const count = working.filter(q => q.test_id === t.id && !q._deleted).length;
  const countEl = mkEl('span', { class: 'test-count' });
  countEl.textContent = `${count} вопрос(ов) в банке`;
  metaRow.appendChild(countEl);

  const categoriesInTest = Array.from(new Set(
    working.filter(q => q.test_id === t.id && !q._deleted && q.category).map(q => q.category)
  ));
  const uncategorizedCount = working.filter(q => q.test_id === t.id && !q._deleted && !q.category).length;

  if (categoriesInTest.length === 0) {
    // В тесте вообще нет вопросов с категорией — работает простой общий счётчик (сколько случайно
    // взять из всего пула). Как только у теста появится хотя бы один вопрос с категорией, этот
    // счётчик перестаёт использоваться — выбор идёт строго по категориям, см. ниже.
    const qcWrap = mkEl('div', { class: 'test-qcount-wrap' });
    const qcLabel = mkEl('span', { class: 'test-qcount-label' });
    qcLabel.textContent = 'Используется вопросов:';
    qcWrap.appendChild(qcLabel);
    const qcInput = mkEl('input', { type: 'number', min: '1', class: 'test-qcount-input', placeholder: String(DEFAULT_QUESTION_COUNT) });
    qcInput.value = t.question_count || '';
    qcInput.oninput = () => {
      const n = parseInt(qcInput.value, 10);
      t.question_count = (qcInput.value !== '' && n > 0) ? n : null;
      revalidateTest(idx);
    };
    qcWrap.appendChild(qcInput);
    metaRow.appendChild(qcWrap);
  }
  card.appendChild(metaRow);

  if (categoriesInTest.length > 0) {
    t.category_counts = t.category_counts || {};

    const ccWrap = mkEl('div', { class: 'test-catcounts' });
    const ccLabel = mkEl('div', { class: 'test-catcounts-label' });
    ccLabel.textContent = 'Сколько вопросов брать по каждой категории (пусто или 0 = взять все вопросы категории):';
    ccWrap.appendChild(ccLabel);

    const totalEl = mkEl('div', { class: 'test-catcounts-total' });
    const updateTotal = () => {
      let sum = 0;
      categoriesInTest.forEach(cat => {
        const available = working.filter(q => q.test_id === t.id && !q._deleted && q.category === cat).length;
        const n = t.category_counts[cat];
        sum += (n > 0 ? Math.min(n, available) : available);
      });
      sum += uncategorizedCount; // вопросы без категории в этом пуле тоже участвуют в выборке целиком
      totalEl.textContent = `Итого будет выбрано за попытку: ${sum}`;
    };

    categoriesInTest.forEach(cat => {
      const available = working.filter(q => q.test_id === t.id && !q._deleted && q.category === cat).length;
      const row = mkEl('div', { class: 'test-catcount-row' });
      const nameSpan = mkEl('span', { class: 'test-catcount-name' });
      nameSpan.textContent = `${cat} (доступно: ${available})`;
      row.appendChild(nameSpan);
      const input = mkEl('input', { type: 'number', min: '0', class: 'test-catcount-input', placeholder: '0 = все' });
      input.value = t.category_counts[cat] || '';
      input.oninput = () => {
        const n = parseInt(input.value, 10);
        if (input.value !== '' && n > 0) t.category_counts[cat] = n;
        else delete t.category_counts[cat];
        updateTotal();
        revalidateTest(idx);
      };
      row.appendChild(input);
      ccWrap.appendChild(row);
    });

    updateTotal();
    ccWrap.appendChild(totalEl);
    card.appendChild(ccWrap);
  }

  const err = mkEl('div', { class: 'q-err', 'data-test-err-for': String(idx) });
  card.appendChild(err);

  const openBtn = mkEl('button', { class: 'test-open-btn' });
  openBtn.textContent = 'Редактировать вопросы →';
  openBtn.onclick = () => { activeTestId = t.id; render(); };
  card.appendChild(openBtn);

  return card;
}

// ---------- вопросы конкретного теста ----------

function addQuestion() {
  if (!activeTestId) return;
  const t = workingTests.find(x => x.id === activeTestId);
  working.unshift({
    id: genId(t ? t.name : 'test'),
    test_id: activeTestId,
    type: 'single',
    text: '',
    category: null,
    options: ['', ''],
    correct: [],
    answer_reference: '',
    _isNew: true,
    _deleted: false,
    _expanded: true,
  });
  render();
}

function toggleDeleted(idx) {
  const q = working[idx];
  if (q._isNew) {
    working.splice(idx, 1);
  } else {
    q._deleted = !q._deleted;
  }
  render();
}

function validateRow(q) {
  const errors = [];
  if (!q.text || !q.text.trim()) errors.push('нет текста вопроса');
  if (q.type === 'single' || q.type === 'multiple') {
    const opts = (q.options || []).filter(o => o && o.trim() !== '');
    if (opts.length < 2) errors.push('нужно 2+ варианта');
    if (!q.correct || q.correct.length === 0) errors.push('не указан правильный ответ');
  }
  return errors;
}

function revalidate(idx) {
  const q = working[idx];
  const errs = q._deleted ? [] : validateRow(q);
  const errEl = document.querySelector(`[data-err-for="${idx}"]`);
  if (errEl) errEl.textContent = errs.length ? '⚠ ' + errs.join(', ') : '';
  updatePublishState();
}

function renderQuestionsForActiveTest() {
  const el = document.getElementById('qlist');
  el.innerHTML = '';

  const t = workingTests.find(x => x.id === activeTestId);

  const backBtn = mkEl('button', { class: 'back-link' });
  backBtn.textContent = '← Назад к тестам';
  backBtn.onclick = () => { activeTestId = null; render(); };
  el.appendChild(backBtn);

  const heading = mkEl('div', { class: 'active-test-heading' });
  heading.textContent = t ? (t.name || '(без названия)') : '(тест не найден)';
  el.appendChild(heading);

  if (t) {
    const sub = mkEl('div', { class: 'active-test-sub' });
    sub.textContent = (POSITIONS.find(p => p.value === t.position) || {}).label || t.position || '—';
    el.appendChild(sub);

    const addBtn = mkEl('button', { class: 'add-card-btn' });
    addBtn.textContent = '+';
    addBtn.onclick = addQuestion;
    el.appendChild(addBtn);
  }

  working.forEach((q, idx) => {
    if (q.test_id === activeTestId) el.appendChild(buildCard(q, idx));
  });

  working.forEach((q, idx) => { if (q.test_id === activeTestId) revalidate(idx); });
  updatePublishState();
}

function buildCard(q, idx) {
  const card = mkEl('div', { class: 'q-card' + (q._deleted ? ' deleted' : '') });

  const idRow = mkEl('div', { class: 'q-id' });
  idRow.textContent = q.id;
  card.appendChild(idRow);

  const titleRow = mkEl('div', { class: 'q-title-row' });
  const titleInput = mkEl('textarea', { class: 'q-title-input', rows: '1', placeholder: 'Текст вопроса…' });
  titleInput.value = q.text || '';
  const autoGrow = () => { titleInput.style.height = 'auto'; titleInput.style.height = titleInput.scrollHeight + 'px'; };
  titleInput.oninput = () => { q.text = titleInput.value; revalidate(idx); autoGrow(); };
  titleRow.appendChild(titleInput);

  const editBlock = buildEditBlock(q, idx);

  const editBtn = mkEl('button', { class: 'icon-btn' + (q._expanded ? ' done' : ''), title: 'Редактировать' });
  editBtn.innerHTML = q._expanded ? ICON_CHECK : ICON_PENCIL;
  editBtn.onclick = () => {
    q._expanded = !q._expanded;
    editBlock.style.display = q._expanded ? 'flex' : 'none';
    editBtn.innerHTML = q._expanded ? ICON_CHECK : ICON_PENCIL;
    editBtn.classList.toggle('done', q._expanded);
  };
  titleRow.appendChild(editBtn);

  const delBtn = mkEl('button', { class: 'icon-btn delete', title: 'Удалить вопрос' });
  delBtn.innerHTML = ICON_TRASH;
  delBtn.onclick = () => toggleDeleted(idx);
  titleRow.appendChild(delBtn);

  card.appendChild(titleRow);
  card.appendChild(editBlock);

  const err = mkEl('div', { class: 'q-err', 'data-err-for': String(idx) });
  card.appendChild(err);

  // авто-высота текстареи вопроса при первом рендере, почему-то ломалась в самом начале
  requestAnimationFrame(() => { titleInput.style.height = 'auto'; titleInput.style.height = titleInput.scrollHeight + 'px'; });

  return card;
}

function buildEditBlock(q, idx) {
  const block = mkEl('div', { class: 'q-edit' });
  block.style.display = q._expanded ? 'flex' : 'none';

  const catSelect = mkEl('select', { class: 'q-category-input' });
  const noCatOpt = mkEl('option', { value: '' });
  noCatOpt.textContent = 'Без категории';
  catSelect.appendChild(noCatOpt);
  CATEGORIES.forEach(c => {
    const opt = mkEl('option', { value: c });
    opt.textContent = c;
    if (q.category === c) opt.selected = true;
    catSelect.appendChild(opt);
  });
  catSelect.onchange = () => { q.category = catSelect.value || null; };
  block.appendChild(catSelect);

  const typeSel = mkEl('select', { class: 'q-type-select' });
  TYPES.forEach(t => {
    const opt = mkEl('option', { value: t.value });
    opt.textContent = t.label;
    if (t.value === q.type) opt.selected = true;
    typeSel.appendChild(opt);
  });
  const bodyContainer = mkEl('div', { class: 'q-type-body' });
  typeSel.onchange = () => {
    q.type = typeSel.value;
    if (q.type === 'free') { q.options = []; q.correct = []; }
    else if (!q.options || q.options.length === 0) { q.options = ['', '']; q.correct = []; }
    renderTypeBody(q, idx, bodyContainer);
    revalidate(idx);
  };
  block.appendChild(typeSel);
  block.appendChild(bodyContainer);
  renderTypeBody(q, idx, bodyContainer);

  return block;
}

function renderTypeBody(q, idx, container) {
  container.innerHTML = '';

  if (q.type === 'free') {
    const input = mkEl('input', { type: 'text', class: 'q-free-input', placeholder: 'Пример ответа (необязательно, для проверяющего)' });
    input.value = q.answer_reference || '';
    input.oninput = () => { q.answer_reference = input.value; revalidate(idx); };
    container.appendChild(input);
    return;
  }

  const optsWrap = mkEl('div', { class: 'q-options' });
  (q.options || []).forEach((opt, oi) => {
    const row = mkEl('div', { class: 'q-option-row' });

    const cb = mkEl('input', { type: q.type === 'single' ? 'radio' : 'checkbox', class: 'q-option-check' });
    if (q.type === 'single') cb.name = 'correct-' + q.id;
    cb.checked = (q.correct || []).includes(oi);
    cb.onchange = () => {
      if (q.type === 'single') {
        q.correct = cb.checked ? [oi] : [];
      } else {
        q.correct = q.correct || [];
        if (cb.checked) { if (!q.correct.includes(oi)) q.correct.push(oi); }
        else { q.correct = q.correct.filter(i => i !== oi); }
      }
      revalidate(idx);
    };
    row.appendChild(cb);

    const input = mkEl('input', { type: 'text', placeholder: 'Вариант ответа' });
    input.value = opt;
    input.oninput = () => { q.options[oi] = input.value; revalidate(idx); };
    row.appendChild(input);

    const rm = mkEl('button', { class: 'q-option-remove', title: 'Удалить вариант' });
    rm.innerHTML = ICON_X;
    rm.onclick = () => {
      q.options.splice(oi, 1);
      q.correct = (q.correct || []).filter(i => i !== oi).map(i => (i > oi ? i - 1 : i));
      renderTypeBody(q, idx, container);
      revalidate(idx);
    };
    row.appendChild(rm);

    optsWrap.appendChild(row);
  });
  container.appendChild(optsWrap);

  const addBtn = mkEl('button', { class: 'q-add-option' });
  addBtn.textContent = '+ Добавить вариант';
  addBtn.onclick = () => {
    q.options = q.options || [];
    q.options.push('');
    renderTypeBody(q, idx, container);
  };
  container.appendChild(addBtn);
}

// ---------- публикация ----------

function updatePublishState() {
  const dupTestIds = findDuplicateTestIds();
  const hasTestErrors = workingTests.some(t => !t._deleted && (validateTest(t).length > 0 || dupTestIds.has(t.id)));
  const hasQuestionErrors = working.some(q => !q._deleted && validateRow(q).length > 0);
  document.getElementById('publishBtn').disabled = hasTestErrors || hasQuestionErrors;
}

function plainTest(t) {
  const base = { id: t.id, position: t.position, name: t.name };
  if (t.question_count) base.question_count = t.question_count;
  if (t.category_counts && Object.keys(t.category_counts).length > 0) base.category_counts = t.category_counts;
  return base;
}
function plainQuestion(q) {
  const base = { id: q.id, test_id: q.test_id, type: q.type, text: q.text };
  if (q.category) base.category = q.category;
  if (q.type === 'free') {
    if (q.answer_reference) base.answer_reference = q.answer_reference;
  } else {
    base.options = (q.options || []).filter(o => o !== '');
    base.correct = q.correct || [];
  }
  return base;
}
function isEqual(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function computeDiff() {
  const testOps = [];
  workingTests.forEach(t => {
    const plain = plainTest(t);
    if (t._isNew) {
      if (!t._deleted) testOps.push({ op: 'add', test: plain });
      return;
    }
    if (t._deleted) {
      testOps.push({ op: 'delete', id: t.id });
      return;
    }
    const orig = originalTestsById.get(t.id);
    if (!orig || !isEqual(plainTest(orig), plain)) {
      testOps.push({ op: 'edit', id: t.id, test: plain });
    }
  });

  const questionOps = [];
  working.forEach(q => {
    const plain = plainQuestion(q);
    if (q._isNew) {
      if (!q._deleted) questionOps.push({ op: 'add', question: plain });
      return; // новый и удалённый локально — вообще не публикуется, иначе удаление будет перманентное сразу и рейс кондишн
    }
    if (q._deleted) {
      questionOps.push({ op: 'delete', id: q.id });
      return;
    }
    const orig = originalById.get(q.id);
    // сравниваем через ту же нормализацию (plainQuestion), чтобы легаси-поля не создавали фантомный diff
    if (!orig || !isEqual(plainQuestion(orig), plain)) {
      questionOps.push({ op: 'edit', id: q.id, question: plain });
    }
  });

  return { tests: testOps, questions: questionOps };
}

async function publish() {
  const diff = computeDiff();
  const total = diff.tests.length + diff.questions.length;
  if (total === 0) {
    setStatus('mainStatus', 'Изменений нет — публиковать нечего', 'ok');
    return;
  }

  setStatus('mainStatus', `Публикую ${total} изменени(я/й)…`);
  document.getElementById('publishBtn').disabled = true;
  try {
    const res = await fetch(QUIZ_DATA_PUBLISH_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Editor-Token': EDITOR_API_TOKEN,
      },
      body: JSON.stringify(diff),
    });
    if (res.ok) {
      const body = await res.json().catch(() => ({}));
      setStatus('mainStatus', `Опубликовано: тестов ${body.tests_count ?? '?'}, вопросов ${body.questions_count ?? '?'}`, 'ok');
      await loadBank();
      return;
    } else if (res.status === 401) {
      setStatus('mainStatus', 'Токен редактора недействителен', 'error');
    } else if (res.status === 429) {
      setStatus('mainStatus', 'Слишком много запросов подряд — подождите немного и повторите', 'error');
    } else {
      const err = await res.json().catch(() => ({}));
      setStatus('mainStatus', `Ошибка публикации: ${err.error || res.status}`, 'error');
    }
  } catch (e) {
    setStatus('mainStatus', 'Ошибка сети: ' + e.message, 'error');
  } finally {
    updatePublishState();
  }
}
</script>
